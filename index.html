<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOPHION · Generador de Carruseles</title>

  <!-- Tipografías autoalojadas (funcionan offline; exportación rápida y fiable) -->
  <link rel="stylesheet" href="assets/fonts/fonts.css" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ====================== BARRA SUPERIOR ====================== -->
  <header class="topbar">
    <div class="brandmark">
      <span class="dot"></span>
      <strong>SOPHION</strong>
      <span class="sub">Generador de Carruseles</span>
    </div>

    <div class="topbar-actions">
      <button id="btn-export-current" class="btn btn-ghost" title="Exporta el slide visible">⬇︎ PNG actual</button>
      <button id="btn-export-all" class="btn btn-primary" title="Descarga todos los slides en un .zip">⬇︎ Descargar todo (.zip)</button>
    </div>
  </header>

  <main class="layout">
    <!-- ====================== FILMSTRIP (lista de slides) ====================== -->
    <aside class="filmstrip" id="filmstrip">
      <div class="filmstrip-head">
        <span>Slides</span>
        <span class="hint" id="slide-count">0</span>
      </div>
      <div class="filmstrip-list" id="filmstrip-list"><!-- miniaturas dinámicas --></div>

      <div class="add-buttons">
        <button class="btn btn-add" data-add="cover">+ Portada</button>
        <button class="btn btn-add" data-add="content">+ Contenido</button>
        <button class="btn btn-add" data-add="closing">+ Cierre</button>
      </div>
    </aside>

    <!-- ====================== LIENZO (preview) ====================== -->
    <section class="canvas-area">
      <div class="canvas-toolbar">
        <button id="nav-prev" class="btn btn-nav">‹</button>
        <span id="nav-indicator" class="nav-indicator">0 / 0</span>
        <button id="nav-next" class="btn btn-nav">›</button>

        <span class="spacer"></span>

        <button id="btn-move-up" class="btn btn-nav" title="Mover slide antes">⤴ orden</button>
        <button id="btn-move-down" class="btn btn-nav" title="Mover slide después">⤵ orden</button>
        <button id="btn-duplicate" class="btn btn-nav" title="Duplicar slide">⧉</button>
        <button id="btn-delete" class="btn btn-nav danger" title="Eliminar slide">🗑</button>
      </div>

      <div class="stage-wrap">
        <!-- El slide se renderiza SIEMPRE a 1080x1350 px reales y se escala con CSS para el preview -->
        <div class="stage-scaler" id="stage-scaler">
          <div class="slide" id="stage" data-type="cover"></div>
        </div>
      </div>
    </section>

    <!-- ====================== INSPECTOR (editor) ====================== -->
    <aside class="inspector">
      <div class="tabs">
        <button class="tab is-active" data-tab="slide">Slide</button>
        <button class="tab" data-tab="brand">Marca</button>
      </div>

      <!-- ---- Tab: edición del slide ---- -->
      <div class="tab-panel is-active" data-panel="slide" id="panel-slide">
        <p class="empty-state" id="slide-empty">Añade un slide para empezar a editar.</p>

        <div id="slide-editor" hidden>
          <label class="field" data-show="cover content closing">
            <span>Tipo de slide</span>
            <select id="f-type">
              <option value="cover">Portada (con banner)</option>
              <option value="content">Contenido</option>
              <option value="closing">Cierre (con banner)</option>
            </select>
          </label>

          <!-- Banner PNG: solo portada y cierre -->
          <div class="field banner-field" data-show="cover closing">
            <span>Imagen banner (PNG/JPG) — el hook visual</span>
            <div class="banner-uploader">
              <input type="file" id="f-image" accept="image/*" hidden />
              <button class="btn btn-upload" id="btn-pick-image">📷 Subir imagen</button>
              <button class="btn btn-ghost btn-clear-image" id="btn-clear-image" hidden>Quitar</button>
            </div>
            <label class="range-row">
              <span>Altura del banner</span>
              <input type="range" id="f-banner-height" min="30" max="62" value="48" />
            </label>
            <label class="range-row">
              <span>Posición vertical de la imagen</span>
              <input type="range" id="f-banner-pos" min="0" max="100" value="50" />
            </label>
          </div>

          <label class="field" data-show="cover content closing">
            <span id="kicker-label">Etiqueta / kicker</span>
            <input type="text" id="f-kicker" placeholder="NEUROCIENCIA" />
          </label>

          <label class="field" data-show="cover content closing">
            <span id="heading-label">Titular</span>
            <textarea id="f-heading" rows="3" placeholder="Tu frase con gancho"></textarea>
          </label>

          <label class="field" data-show="content closing">
            <span id="body-label">Texto</span>
            <textarea id="f-body" rows="5" placeholder="Desarrolla la idea aquí..."></textarea>
          </label>

          <label class="field" data-show="closing">
            <span>Llamada a la acción (chips)</span>
            <input type="text" id="f-cta" placeholder="Sigue · Comenta · Guarda · Comparte" />
          </label>

          <label class="field switch-row" data-show="content">
            <input type="checkbox" id="f-show-index" checked />
            <span>Mostrar número de slide</span>
          </label>
        </div>
      </div>

      <!-- ---- Tab: marca ---- -->
      <div class="tab-panel" data-panel="brand" id="panel-brand">
        <label class="field">
          <span>Nombre de marca</span>
          <input type="text" id="b-name" value="SOPHION" />
        </label>
        <label class="field">
          <span>Usuario / handle</span>
          <input type="text" id="b-handle" value="@sophion" />
        </label>

        <div class="field">
          <span>Logo (PNG transparente recomendado)</span>
          <div class="banner-uploader">
            <input type="file" id="b-logo" accept="image/*" hidden />
            <button class="btn btn-upload" id="btn-pick-logo">🖼 Subir logo</button>
            <button class="btn btn-ghost" id="btn-clear-logo" hidden>Quitar</button>
          </div>
        </div>

        <div class="color-grid">
          <label class="color-field"><span>Fondo profundo</span><input type="color" id="b-bg-deep" value="#05060f" /></label>
          <label class="color-field"><span>Fondo medio</span><input type="color" id="b-bg-mid" value="#160b33" /></label>
          <label class="color-field"><span>Acento 1</span><input type="color" id="b-accent" value="#7c5cff" /></label>
          <label class="color-field"><span>Acento 2</span><input type="color" id="b-accent2" value="#3de0ff" /></label>
          <label class="color-field"><span>Texto</span><input type="color" id="b-text" value="#ffffff" /></label>
          <label class="color-field"><span>Texto tenue</span><input type="color" id="b-muted" value="#b9b6d8" /></label>
        </div>

        <label class="field">
          <span>Tipografía de titulares</span>
          <select id="b-font-display">
            <option>Space Grotesk</option>
            <option>Sora</option>
            <option>Archivo</option>
            <option>Manrope</option>
            <option>Poppins</option>
            <option>Bebas Neue</option>
          </select>
        </label>
        <label class="field">
          <span>Tipografía de texto</span>
          <select id="b-font-body">
            <option>Inter</option>
            <option>Manrope</option>
            <option>Sora</option>
            <option>Poppins</option>
          </select>
        </label>

        <div class="field switch-row">
          <input type="checkbox" id="b-starfield" checked />
          <span>Fondo de estrellas (cósmico)</span>
        </div>

        <div class="brand-actions">
          <button class="btn btn-ghost" id="btn-save-brand">💾 Guardar marca</button>
          <button class="btn btn-ghost" id="btn-load-demo">✨ Cargar carrusel demo</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Contenedor oculto para renderizar slides a tamaño completo durante la exportación -->
  <div id="export-sandbox" aria-hidden="true"></div>

  <!-- Librerías para exportar a PNG / ZIP (incluidas localmente, funcionan offline) -->
  <script src="js/vendor/html2canvas.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
