# Deploy en Netlify: conectar el repo y poner "Base directory" = lord-barbershop
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm test"

[functions]
  node_bundler = "esbuild"

# El tag NFC del barbero abre /sello?k=CLAVE → la app del cliente valida el corte
[[redirects]]
  from = "/sello"
  to = "/cuenta.html"
  status = 200

[[redirects]]
  from = "/cuenta"
  to = "/cuenta.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/tarjeta"
  to = "/tarjeta.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tarjeta*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=300"
