<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Generar link de pago</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #14161a; --muted: #5f6672;
    --line: #e3e6ea; --accent: #00a650;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --card: #191c22; --text: #f2f4f7; --muted: #9aa2ae; --line: #2a2f38; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 24px 16px 48px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%; font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .salida {
    margin-top: 16px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    word-break: break-all; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; min-height: 44px;
  }
  .acciones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button, a.boton {
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    border-radius: 10px; padding: 11px 16px; border: 1px solid var(--line);
    background: transparent; color: var(--text); flex: 1; text-align: center;
  }
  button.principal { background: var(--accent); color: #fff; border: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <h1>Generar link de pago</h1>
  <p class="sub">Para uso interno. Creá el link y mandalo por WhatsApp o Instagram.</p>

  <div class="card">
    <label for="monto">Monto en pesos</label>
    <input id="monto" type="number" inputmode="numeric" min="0" step="0.01" placeholder="25000">

    <label for="concepto">Concepto</label>
    <input id="concepto" type="text" placeholder="Plan Pro - Septiembre">

    <label for="ref">Referencia (opcional)</label>
    <input id="ref" type="text" placeholder="Se genera sola si la dejás vacía">

    <div class="salida" id="salida">Completá el monto para ver el link.</div>

    <div class="acciones">
      <button class="principal" type="button" id="copiar">Copiar link</button>
      <a class="boton" id="abrir" href="#" target="_blank" rel="noopener">Previsualizar</a>
    </div>
  </div>
  <p class="sr" role="status" aria-live="polite" id="aviso"></p>
</main>

<script>
(function () {
  "use strict";

  var campos = ["monto", "concepto", "ref"].map(function (id) { return document.getElementById(id); });
  var salida = document.getElementById("salida");
  var abrir = document.getElementById("abrir");
  var base = location.href.replace(/generar\.html.*$/, "index.html");

  function armar() {
    var monto = campos[0].value.trim();
    if (!monto || Number(monto) <= 0) return "";

    var qs = new URLSearchParams({ monto: monto });
    if (campos[1].value.trim()) qs.set("concepto", campos[1].value.trim());
    if (campos[2].value.trim()) qs.set("ref", campos[2].value.trim());
    return base + "?" + qs.toString();
  }

  function refrescar() {
    var url = armar();
    salida.textContent = url || "Completá el monto para ver el link.";
    if (url) {
      abrir.href = url;
      abrir.removeAttribute("aria-disabled");
    } else {
      abrir.href = "#";
      abrir.setAttribute("aria-disabled", "true");
    }
  }

  campos.forEach(function (campo) { campo.addEventListener("input", refrescar); });
  refrescar();

  document.getElementById("copiar").addEventListener("click", function () {
    var url = armar();
    if (!url) { campos[0].focus(); return; }

    var listo = function () { document.getElementById("aviso").textContent = "Link copiado"; };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(listo);
    } else {
      var area = document.createElement("textarea");
      area.value = url;
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); } catch (e) { /* sin permiso */ }
      document.body.removeChild(area);
      listo();
    }
  });
})();
</script>
</body>
</html>
